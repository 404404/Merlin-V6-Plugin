name: EasyTier CI

on:
  pull_request:
    branches: [Main]
  push:
    branches: [Main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Static checks and mocked lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox shellcheck make tar gzip coreutils

      - name: POSIX shell syntax
        run: |
          set -eu
          for file in install.sh uninstall.sh rollback.sh scripts/*.sh init.d/*.sh tests/*.sh; do
            sh -n "$file"
            busybox ash -n "$file"
          done

      - name: JSON metadata syntax
        run: python3 -m json.tool config.json.js > /dev/null

      - name: ShellCheck
        run: |
          shellcheck --shell=sh --exclude=SC1090,SC1091 \
            install.sh uninstall.sh rollback.sh scripts/*.sh init.d/*.sh tests/*.sh

      - name: Lifecycle, events, install, rollback and uninstall tests
        run: sh tests/run.sh

      - name: Makefile and archive structure check with mock cores
        run: |
          make test-package
          sh scripts/check_package.sh

  build:
    name: Build official-core offline packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl unzip make tar gzip coreutils

      - name: Build packages from pinned official releases
        run: |
          make all PLUGIN_VERSION=1.0.1 CORE_VERSION=2.6.4
          sh scripts/check_package.sh

      - name: Upload packages for Release job
        uses: actions/upload-artifact@v4
        with:
          name: easytier-packages
          path: |
            easytier_hnd.tar.gz
            easytier_qca.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
