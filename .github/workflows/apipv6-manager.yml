name: IPv6 Manage CI

on:
  push:
    branches: [IPv6-Fix-In-AP-Mode]
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static-check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes busybox shellcheck python3 nodejs perl

      - name: POSIX sh and BusyBox ash syntax
        run: |
          set -eu
          for file in install.sh uninstall.sh rollback.sh scripts/*.sh init.d/*.sh tests/*.sh tests/mocks/*; do
            [ -f "$file" ] || continue
            sh -n "$file"
            busybox ash -n "$file"
          done

      - name: ShellCheck
        run: shellcheck --shell=sh --severity=error install.sh uninstall.sh rollback.sh scripts/*.sh init.d/*.sh tests/*.sh tests/mocks/*

      - name: Metadata JSON
        run: python3 -m json.tool config.json.js > /dev/null

      - name: Web controller syntax and behavior
        run: node tests/test_web.js

  integration-tests:
    name: Mocked integration and lifecycle tests
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes perl coreutils nodejs curl

      - name: Run CLI, repair safety, migration, install, upgrade, rollback, and uninstall tests
        run: sh tests/run.sh

      - name: Test installed Web page through KoolShare HTTP dispatcher and callbacks
        run: node tests/test_web_api.js

  firmware-shell-tests:
    name: Merlin ash compatibility (no command builtin)
    needs: static-checks
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install isolated build and test tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends build-essential bzip2 ca-certificates curl git perl openssl nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Merlin-era ash without command builtin
        shell: bash
        run: sh tests/build_firmware_shell.sh /opt/apipv6-firmware-shell

      - name: Run complete suite using firmware ash, BusyBox applets, and OpenSSL-only hashing
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ln -sf /opt/apipv6-firmware-shell/busybox /bin/sh
          for applet in awk cat chmod cp date df dirname echo grep mkdir mv printf rm rmdir sed sleep tail test '[' tr wc; do
            ln -sf /opt/apipv6-firmware-shell/busybox "/usr/bin/$applet"
          done
          mv /usr/bin/sha256sum /opt/apipv6-firmware-shell/host-sha256sum
          [ ! -e /bin/sha256sum ]
          [ ! -e /usr/bin/sha256sum ]
          set +e
          sh -c 'command -v date' >/dev/null 2>&1
          probe_rc=$?
          set -e
          [ "$probe_rc" -eq 127 ]
          openssl dgst -sha256 /dev/null
          sh tests/run.sh
          node tests/test_web_api.js

  package-build:
    name: Build HND and QCA packages
    needs: [integration-tests, firmware-shell-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build offline install packages
        run: make all PLUGIN_VERSION=0.1.0

      - name: Upload candidate package set for validation
        uses: actions/upload-artifact@v4
        with:
          name: apipv6-package-candidate
          path: |
            IPv6-Manage_hnd.tar.gz
            IPv6-Manage_qca.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  package-validation-and-artifacts:
    name: Validate and publish test artifacts
    needs: package-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download candidate packages
        uses: actions/download-artifact@v4
        with:
          name: apipv6-package-candidate
          path: .

      - name: Validate package layout, platform markers, metadata, and checksums
        run: sh scripts/check_package.sh

      - name: Upload validated test install packages
        uses: actions/upload-artifact@v4
        with:
          name: apipv6-packages
          path: |
            IPv6-Manage_hnd.tar.gz
            IPv6-Manage_qca.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
